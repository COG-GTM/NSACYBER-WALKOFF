<div class="modal-header">
  <h4 class="modal-title">Override Local Variables</h4>
</div>
<div class="modal-body">
  <div class="container">
    <form #variableForm="ngForm" (ngSubmit)="execute(variableForm)">
      <div class="row">
        @for (v of workflow.referenced_variables; track v) {
          <div class="col-12">
            <div class="form-group">
              <label [for]="v.id">{{ v.name }}</label>
              <input [name]="v.id" [id]="v.id" type="text" class="form-control" [placeholder]="v.value" ngModel>
              @if (v.description) {
                <p class="help-block"><i>{{ v.description }}</i></p>
              }
            </div>
          </div>
        }
      </div>
    </form>
  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss()">Close</button>
  <button type="button" class="btn btn-primary" (click)="execute(variableForm)"><i class="fa fa-play"></i> Execute</button>
</div>
